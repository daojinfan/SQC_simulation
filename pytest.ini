[pytest]
testpaths = tests
pythonpath = src
addopts = --strict-markers
markers =
    contract: deterministic unit, schema, parser, model, or validation test
    integration: temporary filesystem, database, web, subprocess, or API test
    physics_slow: bounded test that enters real QuTiP or numerical evolution
    evidence: frozen authority, notebook replay, byte-match, or historical evidence test
    release: evidence subset required before release
    windows: test with Windows-only qualification meaning
    notebook: test requiring a Jupyter kernelspec
    node: test requiring the project Node runtime
    link_privilege: test requiring link-creation permission
    destructive_fixture: isolated authority mutation test which must not run in parallel
    legacy_environment: test executable only in its historically approved environment
