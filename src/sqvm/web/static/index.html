<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQVM 校准平台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">SQ</span>
        <span><strong>SQVM</strong><small>校准平台 · 校准控制台</small></span>
      </div>
      <nav aria-label="主导航">
        <a href="#/overview" data-nav="overview">总览</a>
        <a href="#/configurations" data-nav="configurations">配置</a>
        <a href="#/experiments" data-nav="experiments">实验结果</a>
        <a href="#/storage" data-nav="storage">实验存储</a>
        <a href="#/trash" data-nav="trash">回收站</a>
      </nav>
      <div class="sidebar-meta">
        <label for="actor-id">本地操作人</label>
        <input id="actor-id" value="project.manager" autocomplete="off" spellcheck="false">
        <span class="readonly-label">仅限本机配置管理</span>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div>
          <p id="view-kicker" class="kicker">平台</p>
          <h1 id="view-title">总览</h1>
        </div>
        <div class="topbar-actions">
          <span id="service-status" class="status status-neutral">检查中</span>
          <button id="refresh" type="button" class="button secondary">刷新</button>
        </div>
      </header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="action-dialog">
    <form method="dialog" id="dialog-form">
      <div class="dialog-head">
        <h2 id="dialog-title">操作</h2>
        <button class="icon-button" value="cancel" aria-label="关闭" title="关闭">x</button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
      <div class="dialog-actions">
        <button value="cancel" class="button secondary">取消</button>
        <button id="dialog-confirm" value="default" class="button primary">确认</button>
      </div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
