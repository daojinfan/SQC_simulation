name: Nightly Physics

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional exact commit SHA. Empty uses the scheduled/default commit.
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate SHA supplied by the release gate.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-physics-${{ inputs.candidate_sha || github.event.inputs.candidate_sha || github.ref }}
  cancel-in-progress: false

jobs:
  physics:
    name: physics-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            lock: requirements-test-py312-windows-lock.txt
            advisory: false
          - platform: linux
            runner: ubuntu-22.04
            lock: requirements-test-py312-linux-lock.txt
            advisory: true
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.event.inputs.candidate_sha || github.sha }}
          fetch-depth: 1
      - name: Prepare controlled artifacts directory
        shell: bash
        run: mkdir -p artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.10
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-cp31210-${{ hashFiles(matrix.lock, 'pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-cp31210-
      - name: Assert clean-checkout data boundary
        shell: bash
        run: |
          test ! -e output
          test -z "$(git ls-files -- output)"
      - name: Install locked test environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r '${{ matrix.lock }}'
          python -m pip install -e . --no-deps
          python -m pip check
          python -m compileall -q src tests/support
          python tests/tools/verify_fixture_manifest.py tests/fixtures/device_model_v1 tests/fixtures/physics_baseline_v1 tests/fixtures/platform_configuration_reference_v1 tests/fixtures/successor_rebaseline_authority_v1
          python tests/tools/generate_physics_baseline_fixture.py --verify tests/fixtures/physics_baseline_v1
          python tests/tools/verify_successor_rebaseline_fixture.py tests/fixtures/successor_rebaseline_authority_v1 --repository-root .
          python tools/verify_successor_development_baseline_approval.py --repository-root .
      - name: Record environment receipt
        shell: bash
        run: |
          git rev-parse HEAD > artifacts/candidate-sha.txt
          python --version > artifacts/python-version.txt
          python -m pip freeze --all > artifacts/pip-freeze.txt
          printf 'platform=%s\nadvisory=%s\n' '${{ matrix.platform }}' '${{ matrix.advisory }}' > artifacts/gate-classification.txt
          env | grep -E '^(OMP|OPENBLAS|MKL|NUMEXPR)_' | sort > artifacts/threading-environment.txt
      - name: Run bounded real-physics suite
        shell: bash
        run: |
          set +e
          # Individual physical workers enforce their bounded timeout; this job never retries WORKER_TIMEOUT.
          python -m pytest -p no:cacheprovider -m physics_slow \
            --junitxml=artifacts/junit-physics-${{ matrix.platform }}.xml --durations=30 \
            2>&1 | tee artifacts/pytest-physics-${{ matrix.platform }}.log
          pytest_status=${PIPESTATUS[0]}
          python tests/tools/verify_physics_suite_count.py \
            tests/physics_suite_lock.json \
            artifacts/junit-physics-${{ matrix.platform }}.xml
          count_status=$?
          if [ "$pytest_status" -ne 0 ]; then
            exit "$pytest_status"
          fi
          exit "$count_status"
      - name: Assert test run preserved data boundary and tracked files
        if: always()
        shell: bash
        run: |
          test ! -e output
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
      - name: Upload physics diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-${{ matrix.platform }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
